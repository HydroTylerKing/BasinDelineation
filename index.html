<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basin Delineator</title>
<link rel="stylesheet" href="/static/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee; --panel: #fffdf8; --ink: #1f2a2e; --muted: #6a7478; --line: #e2ddd2;
    --accent: #0f6e8c; --accent-soft: #d8ecf1; --basin: #c2542d; --warn-bg: #fff2d9; --warn: #8a5a00;
    --err-bg: #fde4e0; --err: #9a2b1b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 330px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 18px; }
  #map { flex: 1; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .src { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hint { background: var(--accent-soft); color: #0b4a5e; border-radius: 8px; padding: 9px 11px; font-size: 13px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 8px; font-weight: 600; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=number], input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; font: 13px "IBM Plex Mono", monospace; background: #fff; color: var(--ink); }
  .thr { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
  .sub { color: var(--muted); font-size: 12px; }
  .coords { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  button { font: 500 13px "IBM Plex Sans", sans-serif; border: 1px solid var(--line); background: #fff;
    color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-family: "IBM Plex Mono", monospace; text-align: right; }
  .big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .big small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .msg { border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .busy { position: fixed; right: 16px; bottom: 16px; z-index: 1000; background: var(--ink); color: #fff;
    padding: 7px 12px; border-radius: 20px; font-size: 13px; display: none; }
  .legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; vertical-align: middle; border-radius: 2px; background: #1565c0; }
  #empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 700px) { #app { flex-direction: column-reverse; } #side { width: 100%; height: 45%; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div>
      <h1>Basin Delineator</h1>
      <div class="src" id="src">loading…</div>
    </div>
    <div class="hint">Click the map to place an outlet. Drag the pin to fine-tune it.</div>

    <section>
      <h2>Stream network</h2>
      <div class="sub" style="margin-bottom:4px">Minimum contributing area</div>
      <div class="thr">
        <input type="range" id="thrSlider" min="0" max="1000" value="500">
        <input type="number" id="thrBox" step="any" min="0" title="km²">
      </div>
      <div class="sub" id="thrCells"></div>
      <label class="check"><input type="checkbox" id="viewNet"> Also show network across the whole view</label>
      <div class="legend" id="legend"></div>
    </section>

    <section>
      <h2>Outlet</h2>
      <label class="row"><span>Snap to nearest stream within</span><span class="sub" id="snapLbl"></span></label>
      <input type="range" id="snap" min="0" max="1000" step="30" value="150">
      <div class="sub" style="margin:10px 0 4px">Or enter coordinates (decimal degrees)</div>
      <div class="coords">
        <input type="text" id="lat" placeholder="lat  -29.31">
        <input type="text" id="lon" placeholder="lon  27.48">
        <button id="go">Go</button>
      </div>
      <label class="check"><input type="checkbox" id="keep"> Keep previous basins on the map</label>
    </section>

    <section id="result">
      <h2>Basin</h2>
      <div id="empty">No basin yet.</div>
      <div id="msgs"></div>
      <div id="card" style="display:none">
        <div class="big" id="area"></div>
        <dl class="stats" id="stats"></dl>
        <div class="btns" style="margin-top:12px">
          <button class="primary" id="dlAll">Download GeoJSON</button>
          <button id="dlBasin">Basin only</button>
          <button id="dlStreams">Streams only</button>
          <button id="zoom">Zoom to basin</button>
        </div>
      </div>
    </section>
  </aside>
  <div id="map"></div>
</div>
<div class="busy" id="busy">Working…</div>

<script src="/static/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let info, current = null, thr = 1, snapM = 150;
const kept = [];

const map = L.map('map', { preferCanvas: true, zoomControl: true });
const base = {
  'Topographic': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles © Esri' }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles © Esri, Maxar, Earthstar Geographics' }),
  'OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      { maxZoom: 17, attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap' }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap contributors' }),
};
base['Topographic'].addTo(map);
L.control.layers(base, null, { position: 'topright' }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const viewLayer = L.layerGroup().addTo(map);
const keptLayer = L.layerGroup().addTo(map);
const basinLayer = L.layerGroup().addTo(map);
const streamLayer = L.layerGroup().addTo(map);
let outletMarker = null, domainRect = null;

const streamWidth = o => [0, 1, 1.6, 2.3, 3.2, 4.2, 5.4, 6.6, 8][Math.min(o || 1, 8)];
const streamColor = o => ['#6ab0e8', '#6ab0e8', '#3f93db', '#1f78c8', '#1565c0', '#0d4f9e', '#0a3d7c', '#08306b', '#08306b'][Math.min(o || 1, 8)];

// ---------- threshold slider (log scale) ----------
function sliderToThr(v) {
  const lo = Math.log10(info.cell_km2 * 5), hi = Math.log10(2000);
  return Math.pow(10, lo + (hi - lo) * v / 1000);
}
function thrToSlider(t) {
  const lo = Math.log10(info.cell_km2 * 5), hi = Math.log10(2000);
  return Math.round(1000 * (Math.log10(t) - lo) / (hi - lo));
}
function fmt(x) {
  if (x == null || isNaN(x)) return '–';
  const a = Math.abs(x);
  if (a >= 1000) return x.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (a >= 100) return x.toFixed(1);
  if (a >= 1) return x.toFixed(2);
  return String(+x.toPrecision(3));
}
function setThr(t, fromBox) {
  thr = Math.max(t, info.cell_km2);
  if (!fromBox) $('thrBox').value = +thr.toPrecision(3);
  $('thrSlider').value = thrToSlider(thr);
  const cells = thr / info.cell_km2;
  $('thrCells').textContent = `${fmt(thr)} km² ≈ ${Math.round(cells).toLocaleString()} cells of ~${Math.round(info.cell_m)} m`;
}
let thrTimer;
function thrChanged() {
  clearTimeout(thrTimer);
  thrTimer = setTimeout(() => { refreshStreams(); refreshView(); }, 120);
}
$('thrSlider').addEventListener('input', e => { setThr(sliderToThr(+e.target.value)); thrChanged(); });
$('thrBox').addEventListener('change', e => { const v = parseFloat(e.target.value); if (v > 0) { setThr(v, true); thrChanged(); } });

$('snap').addEventListener('input', e => { snapM = +e.target.value; $('snapLbl').textContent = snapM ? `${snapM} m` : 'off'; });

// ---------- api ----------
let pending = 0;
function busy(d) { pending += d; $('busy').style.display = pending > 0 ? 'block' : 'none'; }
async function api(path, params) {
  busy(1);
  try {
    const r = await fetch(path + '?' + new URLSearchParams(params));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  } finally { busy(-1); }
}

function showMsgs(list, cls) {
  $('msgs').innerHTML = (list || []).map(m => `<div class="msg ${cls}" style="margin-bottom:8px">${m}</div>`).join('');
}

// ---------- delineation ----------
async function delineate(lat, lon) {
  let res;
  try {
    res = await api('/api/delineate', { lat, lon, snap: snapM, thr });
  } catch (e) { $('empty').style.display = 'none'; showMsgs([e.message], 'err'); return; }
  if (current && $('keep').checked) {
    const g = L.geoJSON(current.basin, { style: { color: '#7d7466', weight: 1.5, fillOpacity: .05, dashArray: '4 3' },
      interactive: false });
    keptLayer.addLayer(g); kept.push(current);
  } else if (!$('keep').checked) { keptLayer.clearLayers(); kept.length = 0; }
  current = res;
  basinLayer.clearLayers();
  L.geoJSON(res.basin, { style: { color: '#c2542d', weight: 2.2, fillColor: '#c2542d', fillOpacity: .09 },
    interactive: false }).addTo(basinLayer);
  drawStreams(res.streams);
  placeOutlet(res.outlet);
  showMsgs(res.warnings, 'warn');
  renderStats();
}

function placeOutlet([lon, lat]) {
  if (outletMarker) map.removeLayer(outletMarker);
  outletMarker = L.marker([lat, lon], { draggable: true, autoPan: true, title: 'Outlet – drag to move' }).addTo(map);
  outletMarker.on('dragend', e => { const p = e.target.getLatLng(); delineate(p.lat, p.lng); });
}

function drawStreams(fc) {
  streamLayer.clearLayers();
  const feats = fc.features.slice().sort((a, b) => (a.properties.order || 0) - (b.properties.order || 0));
  L.geoJSON({ type: 'FeatureCollection', features: feats }, {
    style: f => ({ color: streamColor(f.properties.order), weight: streamWidth(f.properties.order), opacity: .95, lineCap: 'round' }),
    onEachFeature: (f, l) => l.bindTooltip(
      `Order ${f.properties.order} · ${fmt(f.properties.acc_km2)} km² upstream · ${fmt(f.properties.length_km)} km`, { sticky: true })
  }).addTo(streamLayer);
  const maxO = Math.max(0, ...fc.features.map(f => f.properties.order || 0));
  $('legend').innerHTML = maxO ? 'Strahler order ' + Array.from({ length: maxO }, (_, i) =>
    `<span><i style="height:${streamWidth(i + 1)}px;background:${streamColor(i + 1)}"></i> ${i + 1}</span>`).join('') : '';
}

async function refreshStreams() {
  if (!current) return;
  try {
    const r = await api('/api/streams', { id: current.id, thr });
    current.streams = r.streams;
    Object.assign(current.stats, r.stats);
    drawStreams(r.streams);
    renderStats();
  } catch (e) { showMsgs([e.message], 'err'); }
}

function renderStats() {
  const s = current.stats;
  $('empty').style.display = 'none';
  $('card').style.display = 'block';
  $('area').innerHTML = `${fmt(s.area_km2)} <small>km²</small>`;
  const dd = s.stream_length_km / s.area_km2;
  const rows = [
    ['Outlet', `${current.outlet[1].toFixed(5)}, ${current.outlet[0].toFixed(5)}`],
    ['Snapped', `${Math.round(s.snap_distance_m)} m`],
    ['Perimeter', `${fmt(s.perimeter_km)} km`],
    ['Outlet elevation', `${fmt(s.outlet_elev_m)} m`],
    ['Mean elevation', `${fmt(s.mean_elev_m)} m`],
    ['Max elevation', `${fmt(s.max_elev_m)} m`],
    ['Relief', `${fmt(s.relief_m)} m`],
    ['Stream threshold', `${fmt(s.threshold_km2)} km²`],
    ['Stream length', `${fmt(s.stream_length_km)} km`],
    ['Drainage density', `${isFinite(dd) ? dd.toFixed(3) : '–'} km/km²`],
    ['Segments', s.stream_segments.toLocaleString()],
    ['Max Strahler order', s.max_strahler_order || '–'],
    ['Computed in', `${current.ms} ms`],
  ];
  $('stats').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

// ---------- whole-view network ----------
let viewTimer;
async function refreshView() {
  viewLayer.clearLayers();
  if (!$('viewNet').checked) return;
  const b = map.getBounds();
  try {
    const r = await api('/api/view_streams', { w: b.getWest(), s: b.getSouth(), e: b.getEast(), n: b.getNorth(), thr });
    viewLayer.clearLayers();
    L.geoJSON(r.streams, {
      style: f => ({ color: '#4a90c8', opacity: .75, weight: Math.max(.8, Math.min(5, .6 * Math.log10(f.properties.acc_km2 / thr * 10) + .8)) }),
      interactive: false
    }).addTo(viewLayer);
  } catch (e) { showMsgs([e.message], 'warn'); }
}
$('viewNet').addEventListener('change', refreshView);
map.on('moveend', () => { clearTimeout(viewTimer); viewTimer = setTimeout(refreshView, 250); });

// ---------- inputs ----------
map.on('click', e => delineate(e.latlng.lat, e.latlng.lng));
$('go').addEventListener('click', () => {
  const la = parseFloat($('lat').value), lo = parseFloat($('lon').value);
  if (isFinite(la) && isFinite(lo)) { map.setView([la, lo], Math.max(map.getZoom(), 12)); delineate(la, lo); }
});
$('zoom').addEventListener('click', () => current && map.fitBounds(L.geoJSON(current.basin).getBounds(), { padding: [20, 20] }));

function download(obj, name) {
  const blob = new Blob([JSON.stringify(obj)], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function tag() { return `basin_${current.outlet[1].toFixed(4)}_${current.outlet[0].toFixed(4)}`; }
function outletFeature() {
  return { type: 'Feature', properties: { kind: 'outlet', ...current.stats },
    geometry: { type: 'Point', coordinates: current.outlet } };
}
$('dlBasin').addEventListener('click', () => download({ type: 'FeatureCollection', features: [current.basin] }, tag() + '.geojson'));
$('dlStreams').addEventListener('click', () => download(current.streams, tag() + '_streams.geojson'));
$('dlAll').addEventListener('click', () => {
  const basin = { ...current.basin, properties: { kind: 'basin', ...current.basin.properties } };
  const streams = current.streams.features.map(f => ({ ...f, properties: { kind: 'stream', ...f.properties } }));
  download({ type: 'FeatureCollection', features: [basin, outletFeature(), ...streams] }, tag() + '_all.geojson');
});

// ---------- start ----------
(async () => {
  info = await api('/api/info', {});
  $('src').textContent = `${info.source} · ${info.shape[0].toLocaleString()} × ${info.shape[1].toLocaleString()} cells`;
  const [w, s, e, n] = info.bounds;
  domainRect = L.rectangle([[s, w], [n, e]], { color: '#1f2a2e', weight: 1, dashArray: '6 4', fill: false, interactive: false }).addTo(map);
  map.fitBounds([[s, w], [n, e]]);
  setThr(1);
  $('snapLbl').textContent = `${snapM} m`;
})();
</script>
</body>
</html>
